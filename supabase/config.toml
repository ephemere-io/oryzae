# ローカル / CI 用 Supabase スタックの設定。
#
# 目的は E2E を本番 DB から切り離すこと（Issue #490 follow-up）。CI では
# `supabase start` でこの設定のまま使い捨てインスタンスを立て、migrations と
# seed.sql を流してから Playwright を走らせる。本番の SERVICE_ROLE_KEY を CI に
# 置く必要がなくなり、毎回まっさらなので実行順やデータ蓄積に依存しなくなる。
#
# CI 時間を削るため、E2E に不要なサービス（studio / realtime / analytics）は無効化。
# storage はボードの写真カードが使うので有効。inbucket（メール受信箱）は
# 「サインアップ → 確認メール → リンク → ログイン」を E2E で通すために有効。

project_id = "oryzae"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3100"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = false
# 本番と同じく確認メールを必須にする。ローカルは inbucket が受信箱になるので、
# E2E から実際にメールを開いてリンクを踏める（signup.spec.ts）。
# seed 済みアカウントは email_confirmed_at を入れてあるので影響を受けない。
enable_confirmations = true
secure_password_change = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = false

[studio]
enabled = false

# 確認メールの受信箱。E2E がここから token を取り出して /auth/confirm を踏む。
# 実体は Mailpit（旧 CLI の [inbucket] から名称・実装ごと置き換わっている）。
# API が別物なので e2e/fixtures/mailbox.ts も Mailpit 用に書いてある。
[local_smtp]
enabled = true
port = 54324

[analytics]
enabled = false
