name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ドキュメントだけの変更で CI 一式を回すのは無駄（Issue #551）。
    # このリポジトリには branch protection が無く required status checks も存在しないため、
    # skip で PR がマージ不能になる罠は踏まない。将来 branch protection を有効化したら要再確認。
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'

# 追い越された run を止める。main への push だけは、マージを取りこぼさないよう
# キャンセルしない（マージ後に壊れたことへ気づく唯一の網であるため）。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # lint / typecheck / dep-cruise / check:as / knip は本題が合計 23 秒しかないのに、
  # ジョブを分けていたせいで checkout + pnpm setup + install（毎回 約20 秒）を 5 回踏み、
  # 分単位切り上げの課金で 5 分を払っていた（Issue #551）。1 ジョブに畳む。
  #
  # 分割時の利点だった「1 つ落ちても残りの結果が見える」は、個別ステップ +
  # `!cancelled()` で維持する（先頭が落ちても後続は走り、まとめて赤が見える）。
  checks:
    name: Static Checks (lint/type/deps/knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm lint
      - name: TypeCheck
        run: pnpm typecheck
        if: '!cancelled()'
      - name: Dependency Check (DDD Layers)
        run: pnpm dep-cruise
        if: '!cancelled()'
      - name: No `as` Casts
        run: pnpm check:as
        if: '!cancelled()'
      - name: Dead Code Detection (Knip)
        run: pnpm knip
        if: '!cancelled()'
      # 「勝手に回るもの」の一覧（admin の /observability/automation）が実態とずれていないか。
      # ワークフローを足して一覧に書き忘れても何も壊れないので、気づけるのはここだけ。
      - name: Automation Inventory (自動実行の一覧が実態と一致するか)
        run: pnpm check:automation
        if: '!cancelled()'

  # test だけは分けたまま残す。168 秒あるので checks に畳むと 23 秒の静的検査の結果まで
  # 待たされることになり、しかも別ジョブのままでも課金分は変わらない（畳む得が無い）。
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # PR 限定の 2 つの仕事を 1 ジョブに畳む。
  #
  # 分けていた頃、この 2 つは本題が 5 秒と 7 秒しかないのに、Actions の課金が
  # **ジョブ単位で分に切り上げ** られるため合計 2 分を払っていた（9 月実測で 106 回 = 約 106 分）。
  # Issue #551 で lint/type/deps/knip を畳んだのと同じ取りこぼしが、ここに残っていた。
  #
  # 中身は 2 つとも変えていない:
  #   1. 検証ハーネスの「挙動確認ビュー」への導線を PR に貼る（ゲートではない）
  #   2. 新規追加された client コンポーネントに *.verify.tsx を強制する硬いゲート
  #
  # 順番は「ゲートが先、案内が後」。案内側に `!cancelled()` を付けてあるので、
  # ゲートが落ちても導線コメントは貼られる（分けていた頃の挙動を保つ）。
  pr-verify:
    name: Verify (coverage gate + preview links)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 「見た目の実装にはテストを」を CI で強制する硬いゲート。
      # PR で *新規追加* された client の feature コンポーネントに、隣接 *.verify.tsx が無く、
      # かつ `// verify-exempt: <理由>` も無ければ落とす。リネーム(#363 のような移設)は -M で除外。
      # 既存の未カバー部品は「新規追加」ではないので素通り（段階導入を壊さない）。
      - name: Require *.verify.tsx (or // verify-exempt) for newly-added components
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          MERGE_BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          NEW=$(git diff --diff-filter=A -M --name-only "$MERGE_BASE" HEAD -- 'apps/client/src/features' \
            | grep -E 'src/features/.*/components/.*\.tsx$' \
            | grep -vE '\.(verify|test)\.tsx$' || true)
          fail=0
          for f in $NEW; do
            sib="${f%.tsx}.verify.tsx"
            if [ -f "$sib" ]; then
              echo "✓ $f"
            elif grep -q "verify-exempt" "$f"; then
              echo "→ exempt: $f"
            else
              echo "::error file=$f::新規コンポーネントに $sib がありません。検証スペックを追加するか、コンポーネント先頭に '// verify-exempt: <理由>' を記載してください（docs/verify-harness-rollout.md §3）。"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Verify coverage gate failed."
            exit 1
          fi
          echo "Verify coverage gate passed."

      # 検証ハーネスの「挙動確認ビュー」への導線を PR に貼る。
      # 以前は replay をヘッドレス録画→GIF 化していたが、GIF が巨大（212 probe×~5分＝~100MB）で
      # GitHub にアップロードできず機能していなかった。Vercel プレビューの /verify を直接開ける
      # ようにした（verify ルートは VERCEL_ENV=preview で有効）ので、その URL を案内するだけにする。
      # ゲートではない（合否は Test ジョブが担保）。
      - name: Sticky comment with preview /verify links
        if: '!cancelled()'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- verify-demo -->';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            // Vercel のブランチ別プレビュー alias（このリポジトリの命名規則に依存）。
            const slug = pr.head.ref.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const client = `https://oryzae-client-git-${slug}-ephemere-io.vercel.app`;
            const headSha = (pr.head?.sha ?? context.sha).slice(0, 7);
            const body = [
              marker,
              '## 🔬 Verify Harness — 挙動確認ビュー（プレビュー）',
              '',
              'このブランチの Vercel プレビューで検証ハーネスを直接開けます（デプロイ完了後に有効）:',
              '',
              `- 🧩 ダッシュボード: ${client}/verify`,
              `- ▶️ リプレイ: ${client}/verify/replay`,
              '',
              `<sub>🤖 verify ルートは \`VERCEL_ENV=preview\` のプレビューのみ有効（真の本番は 404）· ${headSha} · リンクが 404 の場合は上の「Vercel – oryzae-client」チェックの URL に \`/verify/replay\` を付けて開いてください</sub>`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
