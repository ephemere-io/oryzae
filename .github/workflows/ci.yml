name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  dependency-check:
    name: Dependency Check (DDD Layers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dep-cruise

  knip:
    name: Dead Code Detection (Knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm knip

  # 検証ハーネスの replay をヘッドレス録画→GIF 化し、PR に sticky コメントで自動表示する「ビュー」。
  # ゲートではない（合否は Test ジョブの matrix が担保）。失敗しても PR を止めない。
  verify-demo:
    name: Verify Replay Demo (PR comment)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build workspace deps (dev サーバ起動に必要)
        run: pnpm --filter @oryzae/shared build && pnpm --filter @oryzae/server build
      - name: Install Playwright chromium
        run: pnpm --filter @oryzae/client exec playwright install chromium --with-deps
      - name: Write .env (dev サーバ起動用。/verify はバックエンド不要だが next dev の起動に必要)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EMAIL_ENABLED=false
          EOF
      - name: Record replay → GIF
        continue-on-error: true
        run: |
          pnpm --filter @oryzae/client dev > /tmp/dev.log 2>&1 &
          npx --yes wait-on -t 120000 http://localhost:3000/verify || { echo "::group::dev.log"; cat /tmp/dev.log; echo "::endgroup::"; exit 1; }
          pnpm --filter @oryzae/client verify:record --base http://localhost:3000 --dwell 900
          SRC=$(ls -t apps/client/recordings/*.webm | head -1)
          echo "source: $SRC"
          ffmpeg -y -ss 1.1 -i "$SRC" -vf "fps=12,scale=820:-1:flags=lanczos,palettegen=stats_mode=diff" /tmp/pal.png
          ffmpeg -y -ss 1.1 -i "$SRC" -i /tmp/pal.png -filter_complex "fps=12,scale=820:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=3" apps/client/verify-demo.gif
          ls -la apps/client/verify-demo.gif
      - name: Upload GIF to assets branch + sticky comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- verify-demo -->';
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const branch = 'ci/verify-demos';
            const filePath = `pr-${prNumber}.gif`;
            let rawUrl = null;
            try {
              const gif = fs.readFileSync('apps/client/verify-demo.gif');
              // アセット用ブランチが無ければ default ブランチから作る。
              try {
                await github.rest.repos.getBranch({ owner, repo, branch });
              } catch {
                const info = await github.rest.repos.get({ owner, repo });
                const base = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${info.data.default_branch}`,
                });
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${branch}`,
                  sha: base.data.object.sha,
                });
              }
              let sha;
              try {
                const ex = await github.rest.repos.getContent({ owner, repo, path: filePath, ref: branch });
                sha = ex.data.sha;
              } catch {}
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: filePath,
                branch,
                message: `chore(verify): replay demo for #${prNumber}`,
                content: gif.toString('base64'),
                sha,
              });
              rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filePath}`;
            } catch (e) {
              core.warning(`verify demo gif skipped: ${e}`);
            }
            const headSha = (context.payload.pull_request?.head?.sha ?? context.sha).slice(0, 7);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const visual = rawUrl
              ? `![verify replay demo](${rawUrl}?t=${context.runId})`
              : '_replay GIF を生成できませんでした（Record ステップのログを確認）。_';
            const body = `${marker}\n## 🔬 Verify Harness — replay demo\n\n${visual}\n\n<sub>🤖 \`/verify/replay\` を CI でライブ録画→GIF 自動生成 · ${headSha} · [run](${runUrl})</sub>`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
