name: E2E Tests

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 UTC 0:00 (JST 9:00)
  workflow_dispatch:        # 手動実行も可能
  # PR では `run-e2e` ラベルが付いたときだけ走らせる。
  # E2E は本番 Supabase にテストデータを作る（各テストが後始末はするが、
  # 失敗時は残る）ため、全 PR で自動実行はしない。危ない変更のときだけ付ける。
  pull_request:
    types: [labeled, synchronize]

# 同一 PR で連続 push したときは古い実行を打ち切る（本番への無駄な書き込みを減らす）。
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-client:
    name: Playwright E2E (Client)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @oryzae/client exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm --filter @oryzae/client exec playwright test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-client
          path: apps/client/test-results/
          retention-days: 7

  e2e-admin:
    name: Playwright E2E (Admin)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @oryzae/admin exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm --filter @oryzae/admin exec playwright test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-admin
          path: apps/admin/test-results/
          retention-days: 7
